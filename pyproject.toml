[project]
name = "iirabm-twin"
version = "0.0.1"
description = "A digital-twin loop (measure, model, modulate) on the public IIRABM, run in simulation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# Runtime dependencies are added as phases need them.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.ruff]
line-length = 100
extend-exclude = ["engine"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
